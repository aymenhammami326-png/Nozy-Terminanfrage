<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nozy Team-Anfrage • Revo City</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{min-height:100vh;background:#090909;color:#f7f2e9;font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top left, rgba(255,236,195,0.2), transparent 18%),radial-gradient(circle at bottom right, rgba(255,189,73,0.18), transparent 20%),linear-gradient(180deg,#090909 0%,#050505 100%);pointer-events:none;}
.container{position:relative;width:100%;max-width:740px;background:rgba(14,11,8,0.95);border:1px solid rgba(255,221,128,0.15);border-radius:30px;padding:35px;box-shadow:0 30px 90px rgba(0,0,0,0.4);overflow:hidden;}
.container::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,0.03), transparent 45%, rgba(255,194,90,0.12));pointer-events:none;border-radius:30px;}
.top{position:relative;z-index:1;margin-bottom:28px;}
.brand{display:inline-flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(255,215,102,0.12);border-radius:999px;color:#ffe4a0;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.18em;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#ffd44d;box-shadow:0 0 12px rgba(255,212,77,0.45);}
h1{font-size:clamp(2rem,4vw,3.6rem);line-height:1.02;margin:22px 0 12px;color:#fff;}
p{color:rgba(247,242,233,0.76);font-size:1rem;line-height:1.9;margin-bottom:24px;}
.hero-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;}
.hero-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,215,102,0.16);border-radius:26px;padding:26px;box-shadow:0 22px 60px rgba(0,0,0,0.25);}
.hero-card h2{margin:0 0 16px;font-size:1.4rem;color:#ffe9b8;}
.hero-card p{margin:0;color:rgba(247,242,233,0.75);line-height:1.8;}
form{position:relative;z-index:1;display:grid;gap:18px;}
.form-group{display:grid;gap:10px;}
label{font-size:0.82rem;text-transform:uppercase;letter-spacing:0.16em;color:rgba(255,219,144,0.9);}
input,textarea{width:100%;padding:15px 16px;border-radius:18px;border:1px solid rgba(255,215,102,0.18);background:rgba(255,255,255,0.06);color:#fff;font-size:0.98rem;outline:none;}
input[readonly]{opacity:0.9;background:rgba(255,215,102,0.08);}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.5);}
textarea{min-height:140px;resize:vertical;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
button{width:100%;padding:16px 18px;border:none;border-radius:18px;background:linear-gradient(135deg,#fff1c1,#ffd44d 60%,#cca420);color:#1d1000;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s ease,filter .2s ease;}
button:hover{transform:translateY(-2px);filter:brightness(1.05);}
.status{display:none;padding:16px 18px;border-radius:18px;font-weight:600;line-height:1.5;}
.status.ok{display:block;background:rgba(110, 204, 146, 0.14);color:#d6ffd1;border:1px solid rgba(110, 204, 146, 0.3);}
.status.error{display:block;background:rgba(255, 148, 148, 0.14);color:#ffd9d9;border:1px solid rgba(255, 148, 148, 0.3);}
@media(max-width:780px){.hero-grid{grid-template-columns:1fr;}.row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <h1>Terminanfrage
    </h1>
    <p>Alle Team-Anfragen an Nozy laufen hier über Discord. Schicke eine Anfrage, und sie landet direkt bei Nozy Abi.</p>
  </div>
  <form id="appointmentForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Max Mustermann" required>
    </div>
    <div class="form-group">
      <label for="contact">Kontakt (Discord / E-Mail)</label>
      <input id="contact" name="contact" type="text" placeholder="name#1234 oder mail@domain.de" required>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="date">Datum</label>
        <input id="date" name="date" type="date" required>
      </div>
      <div class="form-group">
        <label for="time">Uhrzeit</label>
        <input id="time" name="time" type="time" required>
      </div>
    </div>
    <div class="form-group">
      <label for="topic">Anliegen</label>
      <textarea id="topic" name="topic" placeholder="Worum geht es?" required></textarea>
    </div>
    <input type="hidden" name="member" value="Nozy">
    <div class="status" id="statusMessage"></div>
    <button type="submit">Anfrage an Nozy senden</button>
  </form>
</div>
<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1531069321428865064/IovM1plJD0owkC4QS7onnULgkvBFUD0Zcxr1G6k0ovYMCjcGFVhdaOdyVAGpLTUrrhLe';
const form = document.getElementById('appointmentForm');
const statusMessage = document.getElementById('statusMessage');
function setStatus(message, type='ok') {
  statusMessage.textContent = message;
  statusMessage.className = 'status ' + (type === 'ok' ? 'ok' : 'error');
}
function getFieldValue(selector) {
  const element = form.querySelector(selector);
  return element ? element.value.trim() : '';
}
async function sendWebhook(data) {
  const payload = {
    username: 'Nozy Team-Anfrage',
    embeds: [{
      title: 'Neue Team-Anfrage für Nozy',
      color: 15844367,
      fields: [
        { name: 'Name', value: data.name, inline: true },
        { name: 'Kontakt', value: data.contact, inline: true },
        { name: 'Team', value: data.member, inline: true },
        { name: 'Datum', value: data.date, inline: true },
        { name: 'Uhrzeit', value: data.time, inline: true },
        { name: 'Anliegen', value: data.topic, inline: false }
      ],
      footer: { text: 'Revo City • Nozy Request' },
      timestamp: new Date().toISOString()
    }]
  };
  const response = await fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!response.ok) {
    throw new Error('Webhook-Fehler: ' + response.status);
  }
}
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  setStatus('Sende Anfrage...', 'ok');
  const data = {
    member: getFieldValue('input[name="member"]'),
    name: getFieldValue('#name'),
    contact: getFieldValue('#contact'),
    date: getFieldValue('#date'),
    time: getFieldValue('#time'),
    topic: getFieldValue('#topic')
  };
  if (!data.name || !data.contact || !data.date || !data.time || !data.topic) {
    setStatus('Bitte fülle alle Felder aus.', 'error');
    return;
  }
  try {
    await sendWebhook(data);
    setStatus('✅ Anfrage erfolgreich gesendet. Nozy bekommt die Nachricht.', 'ok');
    form.reset();
  } catch (error) {
    console.error(error);
    setStatus('⚠️ Webhook nicht erreichbar. Anfrage konnte nicht gesendet werden.', 'error');
  }
});
</script>
</body>
</html>
